[package]
name = "barkod-wasm"
description = "WebAssembly bindings for barkod."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same relationship as barkod-py: the binding depends on the core, the core
# knows nothing about wasm. One compiled implementation reaches both.
barkod = { path = "../barkod", version = "0.1.0" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
