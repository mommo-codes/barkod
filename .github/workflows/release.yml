name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  wheels:
    name: Wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path barkod-py/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: wheels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Published to the registry rather than consumed as a git dependency:
      # npm silently installs the repository root for a `github:` dependency,
      # and this repository's root is a Cargo workspace with no package.json.
      # The failure mode would be a successful install of nothing.
      - name: Build and publish
        working-directory: barkod-wasm/npm
        run: |
          npm install
          npm run build
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the core only
        run: cargo publish -p barkod --token ${{ secrets.CARGO_TOKEN }}
