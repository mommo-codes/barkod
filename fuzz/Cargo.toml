[package]
name = "barkod-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
barkod = { path = "../barkod" }

# cargo-fuzz builds this crate on its own; keeping it out of the parent
# workspace stops the nightly-only build leaking into `cargo test --workspace`.
[workspace]
members = []

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
